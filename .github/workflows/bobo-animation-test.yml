name: Bobo Animation Test

on:
  workflow_dispatch:

jobs:
  bobo-animation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Bobo rig
        run: python scripts/build_bobo_rig.py

      - name: Create automated Bobo animation
        run: python scripts/create_bobo_animation_test.py

      - name: Verify animation
        run: |
          test -f output/bobo_animation_test.mp4
          test -f output/bobo_rig/reconstructed_preview.png
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/bobo_animation_test.mp4

      - name: Upload Bobo animation test
        uses: actions/upload-artifact@v4
        with:
          name: bobo-animation-test
          path: |
            output/bobo_animation_test.mp4
            output/bobo_rig/reconstructed_preview.png
            output/bobo_rig/rig_manifest.json
