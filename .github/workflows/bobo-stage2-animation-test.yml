name: Bobo Stage 2 Animation Test

on:
  workflow_dispatch:

jobs:
  bobo-stage2-animation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Stage-2 Bobo rig
        run: python scripts/build_bobo_rig_stage2.py

      - name: Create conservative Stage-2 animation test
        run: python scripts/create_bobo_stage2_animation_test.py

      - name: Verify animation output
        run: |
          test -s output/bobo_stage2_animation_test.mp4

      - name: Upload Stage-2 animation
        uses: actions/upload-artifact@v4
        with:
          name: bobo-stage2-animation-test
          path: output/bobo_stage2_animation_test.mp4
