name: Bobo Stage 4 Joint Puppet Test

on:
  workflow_dispatch:

jobs:
  stage4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build Stage-4 joint puppet
        run: python scripts/build_bobo_rig_stage4.py
      - name: Create Stage-4 articulation test
        run: python scripts/create_bobo_stage4_animation_test.py
      - name: Verify
        run: |
          test -s output/bobo_rig_stage4/reconstructed_preview.png
          test -s output/bobo_rig_stage4/rig_manifest.json
          test -s output/bobo_stage4_animation_test.mp4
      - name: Upload Stage-4 test
        uses: actions/upload-artifact@v4
        with:
          name: bobo-stage4-joint-puppet-test
          path: |
            output/bobo_rig_stage4/
            output/bobo_stage4_animation_test.mp4
