name: Gemini Bobo Arm Test

on:
  workflow_dispatch:

jobs:
  generate-arm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Bobo left upper arm with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_bobo_arm_gemini.py

      - name: Verify generated layer
        run: |
          test -f output/bobo_gemini_rig/left_upper_arm_test.png
          python - <<'PY'
          from PIL import Image
          p = "output/bobo_gemini_rig/left_upper_arm_test.png"
          im = Image.open(p)
          assert im.mode == "RGBA", im.mode
          assert im.size == (1024, 1536), im.size
          assert im.getchannel("A").getbbox() is not None
          print("Layer validation passed:", im.size, im.mode)
          PY

      - name: Upload Gemini arm test
        uses: actions/upload-artifact@v4
        with:
          name: bobo-gemini-left-upper-arm
          path: output/bobo_gemini_rig/left_upper_arm_test.png
