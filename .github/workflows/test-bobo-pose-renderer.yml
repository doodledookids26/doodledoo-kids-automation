name: Test Bobo Pose Renderer

on:
  workflow_dispatch:

jobs:
  render-bobo-pose-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy

      - name: Generate animation plan
        run: python scripts/generate_animation_plan.py

      - name: Render Bobo pose test
        run: python scripts/render_bobo_pose_test.py

      - name: Verify output
        run: |
          test -s output/DDK001_bobo_pose_test.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 output/DDK001_bobo_pose_test.mp4
          echo "Bobo pose renderer produced a video."

      - name: Upload pose test
        uses: actions/upload-artifact@v4
        with:
          name: bobo-pose-renderer-test
          path: output/DDK001_bobo_pose_test.mp4
