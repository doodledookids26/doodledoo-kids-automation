name: Test DoodleDoo Content Engine

on:
  workflow_dispatch:

jobs:
  test-content-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate script request
        run: python scripts/generate_script.py

      - name: Generate Gemini script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_gemini_script.py

      - name: Verify generated files
        run: |
          test -f output/DDK001_script_request.json
          test -f output/DDK001_script.json
          echo "All generated files verified successfully."

      - name: Display Gemini script
        run: cat output/DDK001_script.json

      - name: Save generated JSON
        uses: actions/upload-artifact@v4
        with:
          name: DDK001-generated-content
          path: output/*.json
