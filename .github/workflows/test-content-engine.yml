name: Test DoodleDoo Content Engine

on:
  workflow_dispatch:

jobs:
  test-content-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Bobo rig automatically
        run: python scripts/build_bobo_rig.py

      - name: Verify Bobo rig
        run: |
          test -f output/bobo_rig/base.png
          test -f output/bobo_rig/head.png
          test -f output/bobo_rig/left_arm.png
          test -f output/bobo_rig/right_arm.png
          test -f output/bobo_rig/left_leg.png
          test -f output/bobo_rig/right_leg.png
          test -f output/bobo_rig/rig_manifest.json
          test -f output/bobo_rig/reconstructed_preview.png
          cat output/bobo_rig/rig_manifest.json

      - name: Generate script request
        run: python scripts/generate_script.py

      - name: Generate Gemini script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_gemini_script.py

      - name: Generate scene plan
        run: python scripts/generate_scenes.py

      - name: Verify generated files
        run: |
          test -f output/DDK001_script_request.json
          test -f output/DDK001_script.json
          test -f output/DDK001_scenes.json
          echo "All generated files verified successfully."

      - name: Create short test video
        run: python scripts/create_video.py

      - name: Create animation test v2
        run: python scripts/create_animation_test_v2.py

      - name: Generate test narration
        run: python scripts/generate_narration.py

      - name: Create narrated test video
        run: python scripts/create_narrated_video.py

      - name: Generate subtitles
        run: python scripts/create_subtitles.py

      - name: Burn subtitles into video
        run: python scripts/burn_subtitles.py

      - name: Verify test video
        run: |
          test -f output/DDK001_test_video.mp4
          test -f output/DDK001_test_narration.mp3
          test -f output/DDK001_test_video_narrated.mp4
          test -f output/DDK001_subtitles.srt
          test -f output/DDK001_test_video_subtitled.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/DDK001_test_video.mp4

      - name: Display Gemini script
        run: cat output/DDK001_script.json

      - name: Save generated content, rig and test video
        uses: actions/upload-artifact@v4
        with:
          name: DDK001-test-video
          path: |
            output/*.json
            output/bobo_rig/*.png
            output/bobo_rig/rig_manifest.json
            output/DDK001_test_video.mp4
            output/DDK001_animation_test_v2.mp4
            output/DDK001_test_narration.mp3
            output/DDK001_test_video_narrated.mp4
            output/DDK001_subtitles.srt
            output/DDK001_test_video_subtitled.mp4
