name: Test DoodleDoo Content Engine

on:
  workflow_dispatch:

jobs:
  test-content-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run content engine
        run: python scripts/generate_script.py

      - name: Verify generated file
        run: |
          test -f output/DDK001_script_request.json
          echo "Generated file successfully."

      - name: Display generated request
        run: cat output/DDK001_script_request.json

      - name: Save generated JSON
        uses: actions/upload-artifact@v4
        with:
          name: DDK001-script-request
          path: output/DDK001_script_request.json

      - name: Display generated request
        run: cat output/DDK001_script_request.json
